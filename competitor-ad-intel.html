<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Competitor Ad Intelligence — Marketing Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .spend-bar { transition: width 0.4s ease; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors text-sm">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        All Reports
      </a>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-cyan-900 text-cyan-300">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse inline-block"></span>
          Live Feed
        </span>
        <button onclick="window.print()" class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          Print
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-8">

    <!-- Page title -->
    <div class="mb-8">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold text-white">Competitor Ad Intelligence</h1>
          <p class="text-cyan-400 text-sm font-medium mt-1.5 uppercase tracking-wide">Meta Ad Library — Daily Creative Feed</p>
        </div>
        <div id="meta-info" class="text-right text-sm text-gray-500 shrink-0"></div>
      </div>
    </div>

    <!-- Loading / Error -->
    <div id="loading" class="py-24 text-center text-gray-500">Loading ad intelligence data...</div>
    <div id="error" class="hidden py-24 text-center">
      <p class="text-red-400 font-medium" id="error-msg">Failed to load data.</p>
    </div>

    <!-- Main content (hidden until loaded) -->
    <div id="content" class="hidden space-y-10">

      <!-- Summary callouts -->
      <section id="summary-section"></section>

      <!-- Leaderboard: Top by Spend -->
      <section>
        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 0V5m0 2c-1.657 0-3-.895-3-2s1.343-2 3-2m0 8v1m0 0v2m0-2c1.11 0 2.08-.402 2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Top Spenders
        </h2>
        <div id="top-spend-table" class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden"></div>
      </section>

      <!-- Leaderboard: Top by Impressions -->
      <section>
        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          Top by Impressions
        </h2>
        <div id="top-impressions-table" class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden"></div>
      </section>

      <!-- Longest Running -->
      <section>
        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Longest-Running Creatives
          <span class="text-xs text-gray-500 font-normal">(longevity = surviving the algo = it's working)</span>
        </h2>
        <div id="longest-running-table" class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden"></div>
      </section>

      <!-- Per-competitor breakdown -->
      <section>
        <h2 class="text-lg font-semibold text-white mb-6 flex items-center gap-2">
          <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Full Competitor Breakdown
        </h2>
        <div id="competitor-grid" class="grid grid-cols-1 gap-8"></div>
      </section>

      <!-- Data source note -->
      <div id="source-note" class="border border-gray-800 rounded-xl p-4 text-sm text-gray-500 bg-gray-900"></div>

    </div>
  </div>

  <script>
    // ─── Helpers ─────────────────────────────────────────────────────────────

    function formatSpend(spend) {
      if (!spend) return '<span class="text-gray-600">—</span>';
      return `<span class="font-mono text-yellow-300">$${spend.label}</span>`;
    }

    function formatImpressions(imp) {
      if (!imp) return '<span class="text-gray-600">—</span>';
      return `<span class="font-mono text-blue-300">${imp.label}</span>`;
    }

    function spendBar(spend, maxSpend) {
      if (!spend || !maxSpend) return '';
      const pct = Math.min(100, Math.round((spend.lower / maxSpend) * 100));
      return `<div class="h-1.5 bg-gray-800 rounded-full mt-1.5 overflow-hidden">
        <div class="spend-bar h-full bg-yellow-400 rounded-full" style="width:${pct}%"></div>
      </div>`;
    }

    function platformBadges(platforms) {
      if (!platforms || platforms.length === 0) return '';
      const map = { facebook: 'FB', instagram: 'IG', audience_network: 'AN', messenger: 'MSG' };
      return platforms.map(p =>
        `<span class="px-1.5 py-0.5 bg-gray-800 text-gray-400 text-xs rounded">${map[p] || p}</span>`
      ).join(' ');
    }

    function competitorBadge(label, color) {
      return `<span class="font-semibold" style="color:${color}">${label}</span>`;
    }

    function adRow(ad, maxSpend, rank) {
      const rankCell = rank != null
        ? `<td class="px-4 py-3 text-gray-600 text-sm font-mono w-8">#${rank + 1}</td>`
        : '';
      return `
        <tr class="border-b border-gray-800 last:border-0 hover:bg-gray-800/30 transition-colors">
          ${rankCell}
          <td class="px-4 py-3">
            <div class="text-sm font-medium text-white">${ad.headline || '<span class="text-gray-600 italic">no headline</span>'}</div>
            ${ad.body ? `<div class="text-xs text-gray-500 mt-0.5 leading-relaxed line-clamp-2">${ad.body}</div>` : ''}
            <div class="flex items-center gap-2 mt-1.5">
              ${ad.competitor ? competitorBadge(ad.competitor, getColor(ad.competitor)) : ''}
              ${ad.platforms ? platformBadges(ad.platforms) : ''}
            </div>
          </td>
          <td class="px-4 py-3 text-right whitespace-nowrap">
            <div>${formatSpend(ad.spend)}</div>
            ${spendBar(ad.spend, maxSpend)}
          </td>
          <td class="px-4 py-3 text-right whitespace-nowrap">${formatImpressions(ad.impressions)}</td>
          <td class="px-4 py-3 text-right whitespace-nowrap text-sm ${ad.daysRunning > 30 ? 'text-purple-300' : 'text-gray-400'}">
            ${ad.daysRunning != null ? `${ad.daysRunning}d` : '—'}
          </td>
          ${ad.snapshotUrl ? `<td class="px-4 py-3 text-right">
            <a href="${ad.snapshotUrl}" target="_blank" rel="noopener" class="text-xs text-indigo-400 hover:text-indigo-300">View →</a>
          </td>` : '<td></td>'}
        </tr>
      `;
    }

    function tableWrap(rows, hasRank) {
      const rankHeader = hasRank ? '<th class="px-4 py-2.5 text-left font-medium text-gray-500 text-xs uppercase tracking-wide w-8"></th>' : '';
      return `
        <table class="w-full text-sm">
          <thead class="bg-gray-800/60">
            <tr>
              ${rankHeader}
              <th class="px-4 py-2.5 text-left font-medium text-gray-500 text-xs uppercase tracking-wide">Ad Creative</th>
              <th class="px-4 py-2.5 text-right font-medium text-gray-500 text-xs uppercase tracking-wide">Spend Range</th>
              <th class="px-4 py-2.5 text-right font-medium text-gray-500 text-xs uppercase tracking-wide">Impressions</th>
              <th class="px-4 py-2.5 text-right font-medium text-gray-500 text-xs uppercase tracking-wide">Days Live</th>
              <th class="px-4 py-2.5 text-right font-medium text-gray-500 text-xs uppercase tracking-wide">Link</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    const colorMap = {};
    function getColor(label) {
      return colorMap[label] || '#9CA3AF';
    }

    // ─── Render functions ─────────────────────────────────────────────────────

    function renderSummary(data) {
      const section = document.getElementById('summary-section');
      if (!data.summary && !data.note) return;

      const items = [];

      if (data.summary) {
        const s = data.summary;
        if (s.topSpender) items.push({ label: 'Top Spender', value: s.topSpender, icon: '💰', color: 'yellow' });
        if (s.fastestGrowing) items.push({ label: 'Fastest Growing', value: s.fastestGrowing, icon: '📈', color: 'cyan' });
        if (s.longestRunning) items.push({ label: 'Longest Running', value: s.longestRunning, icon: '⏱', color: 'purple' });
      }

      const metricCards = items.map(item => `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
          <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">${item.label}</p>
          <p class="text-sm font-medium text-white">${item.value}</p>
        </div>
      `).join('');

      const watchList = data.summary?.watchList?.length
        ? `<div class="bg-gray-900 border border-amber-900/40 rounded-xl p-5">
            <p class="text-xs font-semibold text-amber-400 uppercase tracking-wide mb-3">Watch List — New / Scaling Creatives</p>
            <ul class="space-y-1.5">
              ${data.summary.watchList.map(w => `<li class="text-sm text-gray-300 flex gap-2"><span class="text-amber-500 shrink-0">→</span>${w}</li>`).join('')}
            </ul>
          </div>`
        : '';

      const gapList = data.summary?.underdogGaps?.length
        ? `<div class="bg-gray-900 border border-emerald-900/40 rounded-xl p-5">
            <p class="text-xs font-semibold text-emerald-400 uppercase tracking-wide mb-3">Underdog Gaps — Opportunities</p>
            <ul class="space-y-1.5">
              ${data.summary.underdogGaps.map(g => `<li class="text-sm text-gray-300 flex gap-2"><span class="text-emerald-500 shrink-0">✓</span>${g}</li>`).join('')}
            </ul>
          </div>`
        : '';

      section.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">${metricCards}</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${watchList}${gapList}</div>
      `;
    }

    function renderLeaderboard(containerId, ads, hasRank) {
      const maxSpend = Math.max(...ads.map(a => a.spend?.lower || 0));
      const rows = ads.map((ad, i) => adRow(ad, maxSpend, hasRank ? i : null)).join('');
      document.getElementById(containerId).innerHTML = tableWrap(rows, hasRank);
    }

    function renderCompetitorSection(comp) {
      const el = document.createElement('div');
      el.className = 'bg-gray-900 border border-gray-800 rounded-xl overflow-hidden';

      const maxSpend = Math.max(...comp.topAds.map(a => a.spend?.lower || 0));
      const rows = comp.topAds.map(ad => adRow(ad, maxSpend, false)).join('');
      const errorBanner = comp.error
        ? `<div class="px-5 py-2 bg-red-900/30 text-red-400 text-xs">Fetch error: ${comp.error}</div>`
        : '';

      el.innerHTML = `
        <div class="px-5 py-4 border-b border-gray-800 flex items-center justify-between">
          <h3 class="font-bold text-base" style="color:${comp.color}">${comp.label}</h3>
          <span class="text-xs text-gray-500">${comp.topAds.length} active ad${comp.topAds.length !== 1 ? 's' : ''} tracked</span>
        </div>
        ${errorBanner}
        ${rows ? tableWrap(rows, false) : '<div class="px-5 py-6 text-gray-600 text-sm italic">No ads found.</div>'}
      `;

      document.getElementById('competitor-grid').appendChild(el);
    }

    function renderSourceNote(data) {
      const el = document.getElementById('source-note');
      const source = data.source === 'meta_ad_library' ? 'Live — Meta Ad Library API' : 'Curated — Manually observed from Meta Ad Library';
      el.innerHTML = `
        <p><span class="font-medium text-gray-400">Data source:</span> ${source}</p>
        ${data.note ? `<p class="mt-1">${data.note}</p>` : ''}
        <p class="mt-1">Spend and impression figures are ranges provided by Meta — exact values are not disclosed. "Days live" is calculated from the ad's start date. Long-running ads (30+ days) are a strong signal of creative effectiveness.</p>
        <p class="mt-1">To enable daily live pulls: <code class="bg-gray-800 px-1.5 py-0.5 rounded text-xs font-mono text-gray-300">META_AD_LIBRARY_TOKEN=&lt;token&gt; node scripts/pull-competitor-ads.js</code></p>
      `;
    }

    // ─── Main ─────────────────────────────────────────────────────────────────

    async function init() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const contentEl = document.getElementById('content');

      try {
        const res = await fetch('reports/competitor-ad-intel.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        loadingEl.classList.add('hidden');

        // Build color map from competitor list
        (data.competitors || []).forEach(c => {
          colorMap[c.label] = c.color || '#9CA3AF';
        });

        // Meta info
        document.getElementById('meta-info').innerHTML = `
          <p>Updated: <span class="text-gray-300 font-medium">${data.pulledAt || 'Unknown'}</span></p>
          <p class="mt-0.5">Competitors: <span class="text-gray-300 font-medium">${(data.competitorsTracked || (data.competitors || []).map(c => c.label)).join(', ')}</span></p>
        `;
        document.title = `Competitor Ad Intelligence (${data.pulledAt}) — Marketing Reports`;

        // Summary
        renderSummary(data);

        // Top by spend — use topBySpend if available, otherwise build from competitors
        let topBySpend = data.topBySpend;
        if (!topBySpend) {
          topBySpend = (data.competitors || []).flatMap(c =>
            (c.topAds || []).map(ad => ({ ...ad, competitor: c.label, platforms: ad.platforms }))
          ).sort((a, b) => (b.spend?.lower || 0) - (a.spend?.lower || 0)).slice(0, 5);
        }
        if (topBySpend.length) renderLeaderboard('top-spend-table', topBySpend, true);
        else document.getElementById('top-spend-table').innerHTML = '<div class="p-5 text-gray-600 text-sm italic">No spend data available.</div>';

        // Top by impressions
        let topByImpressions = data.topByImpressions;
        if (!topByImpressions) {
          topByImpressions = (data.competitors || []).flatMap(c =>
            (c.topAds || []).map(ad => ({ ...ad, competitor: c.label }))
          ).sort((a, b) => (b.impressions?.lower || 0) - (a.impressions?.lower || 0)).slice(0, 5);
        }
        if (topByImpressions.length) renderLeaderboard('top-impressions-table', topByImpressions, true);
        else document.getElementById('top-impressions-table').innerHTML = '<div class="p-5 text-gray-600 text-sm italic">No impressions data available.</div>';

        // Longest running
        let longestRunning = data.longestRunning;
        if (!longestRunning) {
          longestRunning = (data.competitors || []).flatMap(c =>
            (c.topAds || []).map(ad => ({ ...ad, competitor: c.label }))
          ).sort((a, b) => (b.daysRunning || 0) - (a.daysRunning || 0)).slice(0, 3);
        }
        if (longestRunning.length) renderLeaderboard('longest-running-table', longestRunning, true);
        else document.getElementById('longest-running-table').innerHTML = '<div class="p-5 text-gray-600 text-sm italic">No data available.</div>';

        // Per-competitor breakdown
        (data.competitors || []).forEach(comp => renderCompetitorSection(comp));

        // Source note
        renderSourceNote(data);

        contentEl.classList.remove('hidden');

      } catch (err) {
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        document.getElementById('error-msg').textContent = `Failed to load: ${err.message}`;
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
