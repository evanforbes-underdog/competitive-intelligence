<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report — Marketing Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      .prose { max-width: 100%; }
    }

    /* Markdown prose styles */
    .prose h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; color: #f9fafb; border-bottom: 1px solid #374151; padding-bottom: 0.5rem; margin-top: 2rem; }
    .prose h2 { font-size: 1.25rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; color: #e5e7eb; }
    .prose h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #d1d5db; }
    .prose h4 { font-size: 1rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.4rem; color: #d1d5db; }
    .prose p { margin-bottom: 0.875rem; color: #d1d5db; line-height: 1.7; }
    .prose ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose li { margin-bottom: 0.375rem; color: #d1d5db; line-height: 1.65; }
    .prose strong { color: #f3f4f6; font-weight: 600; }
    .prose em { color: #c4b5fd; font-style: italic; }
    .prose code { background: #1f2937; color: #a78bfa; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.875em; }
    .prose pre { background: #111827; border: 1px solid #374151; border-radius: 8px; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    .prose pre code { background: none; color: #e5e7eb; padding: 0; }
    .prose blockquote { border-left: 3px solid #6366f1; padding-left: 1rem; margin: 1rem 0; color: #9ca3af; font-style: italic; }
    .prose hr { border-color: #374151; margin: 2rem 0; }
    .prose a { color: #818cf8; text-decoration: underline; }
    .prose a:hover { color: #a5b4fc; }

    /* Table styles */
    .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.875rem; }
    .prose thead { background: #1f2937; }
    .prose th { padding: 0.6rem 0.875rem; text-align: left; font-weight: 600; color: #e5e7eb; border-bottom: 1px solid #374151; }
    .prose td { padding: 0.6rem 0.875rem; color: #d1d5db; border-bottom: 1px solid #1f2937; vertical-align: top; }
    .prose tr:nth-child(even) td { background: #111827; }
    .prose tr:last-child td { border-bottom: none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900 no-print">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors text-sm">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        All Reports
      </a>
      <button onclick="window.print()" class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print
      </button>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-6 py-8 flex gap-8">

    <!-- Sidebar -->
    <aside class="w-64 shrink-0 no-print" id="sidebar">
      <div class="sticky top-8">
        <div id="meta-card" class="bg-gray-900 border border-gray-800 rounded-xl p-5 text-sm space-y-4">
          <div>
            <p class="text-gray-500 text-xs uppercase tracking-wide mb-1">Status</p>
            <div id="meta-status"></div>
          </div>
          <div id="meta-completed-wrap" class="hidden">
            <p class="text-gray-500 text-xs uppercase tracking-wide mb-1">Completed</p>
            <p id="meta-completed" class="text-gray-300 font-medium"></p>
          </div>
          <div>
            <p class="text-gray-500 text-xs uppercase tracking-wide mb-1">Owner</p>
            <p id="meta-owner" class="text-gray-300 font-medium"></p>
          </div>
          <div>
            <p class="text-gray-500 text-xs uppercase tracking-wide mb-1">Issue</p>
            <p id="meta-id" class="text-indigo-400 font-mono font-medium"></p>
          </div>
        </div>

        <a href="index.html" class="mt-4 flex items-center gap-2 w-full px-4 py-2.5 rounded-lg bg-gray-900 border border-gray-800 hover:border-gray-600 text-sm text-gray-300 hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Back to Dashboard
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 min-w-0">
      <!-- Loading state -->
      <div id="loading" class="py-24 text-center text-gray-500">Loading report...</div>

      <!-- Error state -->
      <div id="error" class="hidden py-24 text-center">
        <p class="text-red-400 font-medium text-lg" id="error-msg">Report not found.</p>
        <p class="text-gray-500 text-sm mt-2">Check the URL or return to the dashboard.</p>
        <a href="index.html" class="mt-4 inline-flex items-center text-indigo-400 hover:text-indigo-300 text-sm">
          &larr; Back to all reports
        </a>
      </div>

      <!-- Report content -->
      <article id="report-content" class="hidden">
        <div class="mb-8">
          <h1 id="report-title" class="text-3xl font-bold text-white leading-tight"></h1>
          <p id="report-subtitle" class="text-indigo-400 text-sm font-medium mt-2 uppercase tracking-wide"></p>
        </div>
        <div id="report-body" class="prose max-w-none"></div>
      </article>
    </main>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reportSlug = params.get('report');

    if (!reportSlug) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
      document.getElementById('error-msg').textContent = 'No report specified.';
    } else {
      fetch(`reports/${reportSlug}.json`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('report-content').classList.remove('hidden');

          // Set page title
          document.title = `${data.title} — Marketing Reports`;

          // Populate header
          document.getElementById('report-title').textContent = data.title;
          if (data.subtitle) {
            document.getElementById('report-subtitle').textContent = data.subtitle;
          }

          // Sidebar metadata
          const statusEl = document.getElementById('meta-status');
          if (data.status === 'done') {
            statusEl.innerHTML = `<span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-xs font-semibold bg-emerald-900 text-emerald-300"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>Done</span>`;
          } else {
            statusEl.innerHTML = `<span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-xs font-semibold bg-amber-900 text-amber-300"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse inline-block"></span>In Progress</span>`;
          }

          if (data.completedAt) {
            document.getElementById('meta-completed-wrap').classList.remove('hidden');
            document.getElementById('meta-completed').textContent = data.completedAt;
          }

          document.getElementById('meta-owner').textContent = data.owner || '—';
          document.getElementById('meta-id').textContent = data.id || '—';

          // Render markdown body
          const bodyEl = document.getElementById('report-body');
          if (data.body) {
            bodyEl.innerHTML = marked.parse(data.body);
          } else {
            bodyEl.innerHTML = `<p class="text-gray-500 italic">Report content is not yet available. Check back when the report status is Done.</p>`;
          }
        })
        .catch(err => {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('error').classList.remove('hidden');
          document.getElementById('error-msg').textContent = `Failed to load report: ${reportSlug}`;
          console.error(err);
        });
    }
  </script>
</body>
</html>
